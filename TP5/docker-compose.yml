services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - DB_USER=admin
      - DB_HOST=db
      - DB_NAME=taskdb
      - DB_PASSWORD=password
      - DB_PORT=5432

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend